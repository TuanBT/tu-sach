<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hai Số Phận · Sổ tay đọc sách</title>
<script>try{var t=localStorage.getItem("sotay-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div class="wrap narrow">
  <div class="topbar" id="bar"></div>
  <div id="app"></div>
</div>
<script src="../../data/books.js"></script>
<script src="../../assets/site.js"></script>
<script>
  const book = window.BOOKS.find(b => b.slug === "hai-so-phan");
  document.title = book.title + " · Sổ tay đọc sách";
  Site.bar(document.getElementById("bar"), [{ t: "Sổ tay đọc sách", href: "../../" }, { t: book.title }]);
  Site.book(document.getElementById("app"), book);
</script>
</body>
</html>
